{% extends 'base.html' %}
{% block content %}
<div class="container" style="max-width:480px;padding-top:40px;">
  <h3>Log in</h3>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-primary" type="submit">Log in</button>
  </form>
  <p class="mt-3">No account? <a href="{% url 'accounts:signup' %}">Sign up</a></p>
{% endblock %}
