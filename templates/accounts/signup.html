{% extends 'base.html' %}
{% block content %}
<div class="container" style="max-width:480px;padding-top:40px;">
  <h3>Create an account</h3>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-primary" type="submit">Sign up</button>
  </form>
  <p class="mt-3">Already have an account? <a href="{% url 'accounts:login' %}">Log in</a></p>
{% endblock %}
